# cc-compass 候选场景库
# 这份 YAML 是判官模型（advisor）的"菜单"，规则层未命中时，advisor 会从这里挑。
# 每条字段：
#   id        唯一标识
#   type      cmd | action
#   command   cmd 类对应的命令或工具名
#   title     action 类的标题
#   trigger   什么场景应当推荐（自然语言描述，喂给模型）
#   reason    展示给用户的"为什么"模板
#   steps     action 类的分步操作（可选）

- id: long-session
  type: cmd
  command: /compact
  trigger: 会话已较长（>80 轮 或 transcript >40KB）
  reason: 当前会话已较长，压缩可释放上下文容量

- id: enter-worktree
  type: cmd
  command: EnterWorktree
  trigger: 用户提到重构、大改、实验性改动
  reason: 大改动建议进 worktree 隔离试验

- id: enter-plan
  type: cmd
  command: EnterPlanMode
  trigger: 需求开放、涉及设计决策、用户在征求建议
  reason: 先对齐方案再动手能减少返工

- id: commit
  type: cmd
  command: /commit
  trigger: 用户提到提交、push、发 PR
  reason: 生成规范 commit message

- id: review
  type: cmd
  command: /review
  trigger: 改动较多，准备提交前
  reason: 提交前过一遍质量

- id: security-review
  type: cmd
  command: /security-review
  trigger: 涉及安全敏感改动
  reason: 跑一遍安全检查更稳

- id: simplify
  type: cmd
  command: /simplify
  trigger: 一段实现刚写完
  reason: 检查重复、抽象与效率

- id: clear
  type: cmd
  command: /clear
  trigger: 话题切换且会话已较长
  reason: 避免旧上下文干扰

- id: init
  type: cmd
  command: /init
  trigger: 新项目无 CLAUDE.md
  reason: 让 Claude 理解你的代码库

- id: statusline
  type: cmd
  command: /statusline-setup
  trigger: 想常驻显示信息
  reason: statusline 是合适的位置

- id: keybindings
  type: cmd
  command: /keybindings-help
  trigger: 想改键位绑定
  reason: 配置键盘快捷键

- id: update-config
  type: cmd
  command: /update-config
  trigger: 涉及 settings 或自动行为
  reason: 用 hook 实现自动行为

- id: fewer-permission-prompts
  type: cmd
  command: /fewer-permission-prompts
  trigger: 频繁被询问 Bash 权限
  reason: 生成 allowlist 减少打扰

- id: loop
  type: cmd
  command: /loop
  trigger: 需要定时或反复执行
  reason: 周期触发命令

- id: lark-mail
  type: cmd
  command: /lark-mail
  trigger: 涉及邮件
  reason: 直接收发飞书邮件

- id: lark-doc
  type: cmd
  command: /lark-doc
  trigger: 涉及飞书文档
  reason: 读写飞书云文档

- id: lark-wiki
  type: cmd
  command: /lark-wiki
  trigger: 涉及飞书知识库
  reason: 管理 wiki 节点

- id: lark-calendar
  type: cmd
  command: /lark-calendar
  trigger: 涉及日程、会议、约时间
  reason: 查询/创建日程

- id: lark-im
  type: cmd
  command: /lark-im
  trigger: 涉及飞书消息、群聊
  reason: 收发与搜索聊天

- id: lark-base
  type: cmd
  command: /lark-base
  trigger: 涉及多维表格
  reason: 建表、字段、记录读写

- id: lark-task
  type: cmd
  command: /lark-task
  trigger: 涉及待办、任务清单
  reason: 创建与跟踪任务

- id: lark-sheets
  type: cmd
  command: /lark-sheets
  trigger: 涉及电子表格读写
  reason: 创建与批量读写表格

- id: lark-drive
  type: cmd
  command: /lark-drive
  trigger: 涉及云空间文件、上传下载
  reason: 管理云空间文件

- id: lark-vc
  type: cmd
  command: /lark-vc
  trigger: 已结束的会议、会议纪要
  reason: 查询会议记录与纪要

- id: lark-minutes
  type: cmd
  command: /lark-minutes
  trigger: 飞书妙记 URL
  reason: 提取妙记 AI 产物

- id: frontend-design
  type: cmd
  command: /frontend-design
  trigger: 创建网页/组件/前端界面
  reason: 生成有设计感的前端代码

- id: claude-api
  type: cmd
  command: /claude-api
  trigger: 构建 Anthropic SDK 应用、模型迁移
  reason: 包含缓存等最佳实践

- id: explore-agent
  type: action
  title: 用 Explore subagent 做广度搜索
  trigger: 跨多目录或不确定位置的搜索
  reason: 节省主上下文
  steps:
    - 告诉 Claude："用 Explore agent 找 <关键词>"
    - Claude 会调 Agent 工具并指定 subagent_type=Explore
    - agent 返回精炼结果，不污染主对话

- id: parallel-agents
  type: action
  title: 并行调用多个 Agent
  trigger: 多个独立子任务
  reason: 并行 tool calls 提速
  steps:
    - 在同一条消息里发多个 Agent tool 调用
    - 例如同时跑 Explore（搜代码）和 general-purpose（搜文档）

- id: memory-save
  type: action
  title: 把偏好写入 memory
  trigger: 用户说"记住/下次/以后"
  reason: 未来会话自动加载
  steps:
    - 告诉 Claude："把刚才那条规则记到 memory"
    - Claude 会写到 ~/.claude/projects/<project>/memory/
    - 注意：自动行为类需要 hook 而非 memory，那种用 /update-config

- id: ide-extension
  type: action
  title: 装 IDE 扩展
  trigger: 用户问 IDE 集成
  reason: 在编辑器内直接用 Claude Code
  steps:
    - VS Code：在扩展市场搜 "Claude Code"
    - JetBrains：在 Plugins 搜 "Claude Code"

- id: skill-maker
  type: cmd
  command: /lark-skill-maker
  trigger: 想把飞书相关流程封装成可复用 skill
  reason: 生成 skill 模板
